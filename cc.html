<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎光临</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .welcome-container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
        }
        
        h1 {
            font-size: 48px;
            color: #333;
            margin-bottom: 20px;
            animation: slideDown 0.8s ease-out;
        }
        
        .subtitle {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.3s both;
        }
        
        p {
            font-size: 16px;
            color: #888;
            line-height: 1.8;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.6s both;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background 0.3s;
            animation: fadeIn 1s ease-out 0.9s both;
        }
        
        .btn:hover {
            background: #764ba2;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>欢迎光临</h1>
        <div class="subtitle">Welcome</div>
        <p>感谢您的访问！我们很高兴为您提供最好的服务。</p>
        <a href="#" class="btn">开始浏览</a>
    </div>
</body>
</html>
